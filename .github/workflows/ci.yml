name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --legacy-peer-deps

      - name: Generated fixtures match the workbook
        run: node scripts/parse-excel.cjs && git diff --exit-code

      - name: Calculator smoke test
        run: npm run check:calculator

      - name: i18n keys
        run: npm run check:i18n

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r functions/requirements.txt
          cd functions && pytest -q

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --legacy-peer-deps

      - name: Install emulator test dependencies
        run: |
          npm install --no-save --legacy-peer-deps firebase-tools @firebase/rules-unit-testing
          python -m pip install --upgrade pip
          python -m pip install -r functions/requirements.txt

      - name: Firestore rules and callable tests
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
        run: |
          npx firebase emulators:exec --only firestore --project demo-milk-farm \
            "npm run test:rules && cd functions && REQUIRE_EMULATOR=1 python -m pytest tests/test_callables.py -q"
